# D1 · Cỡ mẫu, Nguyễn Hoa Thanh Tùng (baseline 0,70; alpha 0,05 hai phía; power 0,80; ICC 0,02)
# Tính lại bằng python lab13.py từ src/. Với c cụm và m yêu cầu/cụm, DE = 1 + (m − 1) × ICC, n hiệu dụng = c × m / DE.
#   a) Theo yêu cầu, +5 điểm: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48, cần 3.103 yêu cầu và 42 nhân viên mỗi nhóm. Tổng 84 vượt số 40 nhân viên hiện có.
#   c) Với 20 nhân viên mỗi nhóm, n hiệu dụng < 20 / 0,02 = 1.000, dưới mức 1.251 cần cho +5 điểm.
#   d) Với 6 depot mỗi nhóm, n hiệu dụng < 6 / 0,02 = 300, dưới mức 1.251 cần cho +5 điểm.
#   e) Với +6 điểm, cần 859 quan sát hiệu dụng mỗi nhóm. Với 20 nhân viên mỗi nhóm, cần ít nhất 299 yêu cầu/người.
#      Khi đó DE = 6,96 và 5.980 yêu cầu thực tế mỗi nhóm tương đương 859,20 quan sát hiệu dụng.
#      Nếu hiệu ứng thật chỉ +5 điểm, power còn khoảng 0,64 ở cỡ mẫu này, theo xấp xỉ chuẩn hai phía.
#
# Bàn giao D1 ở CP4 · Nguyễn Hoa Thanh Tùng → Vũ Trí Dũng (D2), Khổng Tiến Dương (kế hoạch pilot)
# Đề xuất chia ngẫu nhiên theo nhân viên, phân tầng theo depot, 20 nhân viên dùng trợ lý và 20 nhân viên đối chứng cùng kỳ.
# Chia theo yêu cầu có thể đủ mẫu cho +5 điểm nhưng dễ tràn tác động khi cùng nhân viên xử lý cả hai nhóm. Chia theo depot chỉ có 6 cụm mỗi nhóm và thiếu mẫu.
# Thông số đề xuất khi chốt YAML: assignment.unit = staff, control_share = 0,50, mde = 0,06, n_per_arm = 859 (hiệu dụng), design_effect = 6,96, clusters_per_arm = 20.
# Bắt đầu kỳ đo chính khi đủ 20 cụm mỗi nhóm. Lập kế hoạch ít nhất 299 yêu cầu đủ điều kiện mỗi nhân viên, tức 5.980 yêu cầu thực tế mỗi nhóm.
# Nếu cỡ cụm lệch đáng kể hoặc thiếu dữ liệu theo dõi, tính lại cỡ mẫu hiệu dụng trước khi kết luận.
# Đánh đổi đề xuất: thiết kế có power mục tiêu 80% ở mức tăng 6 điểm phần trăm. Nếu mức tăng thật chỉ là 5 điểm phần trăm, power còn khoảng 64%.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có — 20 nhân viên đối chứng làm việc song song trong cùng các tuần và cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng code với seed ghi trước (phân tầng theo depot, mỗi depot 50/50), không để quản lý hay nhân viên tự chọn.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot trao đổi gợi ý; kiểm soát bằng cấp quyền truy cập trợ lý theo tài khoản staff_id nhóm can thiệp, cấm dùng chung gợi ý sang ca đối chứng và ghi log mọi lượt mở theo staff_id để kiểm tra chéo.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có — chốt trước ngày bắt đầu trong pilot_plan.yaml gồm dong_trong_24h_khong_mo_lai_7_ngay, MDE +6 điểm (power 0,64 nếu hiệu ứng thật +5 điểm theo D1), 3 luật dừng và decision_date.
#   5. Ít nhất 20 cụm mỗi nhóm: Đạt — chia theo nhân viên cho đúng 20 cụm mỗi nhóm (20 + 20, mỗi người ≥ 299 yêu cầu, DE = 6,96, đạt 859 quan sát hiệu dụng theo D1 mục e); loại cách chia theo depot (chỉ có 6 cụm/nhóm).
