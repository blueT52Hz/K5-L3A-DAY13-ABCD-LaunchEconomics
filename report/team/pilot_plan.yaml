# D1 · Cỡ mẫu, Nguyễn Hoa Thanh Tùng (baseline 0,70; alpha 0,05 hai phía; power 0,80; ICC 0,02)
# Tính lại bằng python lab13.py từ src/. Với c cụm và m yêu cầu/cụm, DE = 1 + (m − 1) × ICC, n hiệu dụng = c × m / DE.
#   a) Theo yêu cầu, +5 điểm: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48, cần 3.103 yêu cầu và 42 nhân viên mỗi nhóm. Tổng 84 vượt số 40 nhân viên hiện có.
#   c) Với 20 nhân viên mỗi nhóm, n hiệu dụng < 20 / 0,02 = 1.000, dưới mức 1.251 cần cho +5 điểm.
#   d) Với 6 depot mỗi nhóm, n hiệu dụng < 6 / 0,02 = 300, dưới mức 1.251 cần cho +5 điểm.
#   e) Với +6 điểm, cần 859 quan sát hiệu dụng mỗi nhóm. Với 20 nhân viên mỗi nhóm, cần ít nhất 299 yêu cầu/người.
#      Khi đó DE = 6,96 và 5.980 yêu cầu thực tế mỗi nhóm tương đương 859,20 quan sát hiệu dụng.
#      Nếu hiệu ứng thật chỉ +5 điểm, power còn khoảng 0,64 ở cỡ mẫu này, theo xấp xỉ chuẩn hai phía.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: [Nháp] Có — 20 nhân viên đối chứng chạy song song trong cùng các tuần và cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: [Nháp] Bốc thăm ngẫu nhiên bằng code với seed ghi trước (phân tầng theo depot), không để quản lý hay nhân viên tự chọn.
#   3. Ảnh hưởng gián tiếp và cách giảm: [Nháp] Có rủi ro nhân viên cùng depot chia sẻ câu trả lời/gợi ý; giảm bằng cấp quyền truy cập trợ lý theo tài khoản staff_id nhóm can thiệp và log lượt mở theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: [Nháp] Có — ghi sẵn trong pilot_plan.yaml trước ngày chạy gồm dong_trong_24h_khong_mo_lai_7_ngay, MDE, ba luật dừng và decision_date.
#   5. Ít nhất 20 cụm mỗi nhóm: [Nháp] Đạt nếu chia theo nhân viên (20 nhân viên/nhóm = 20 cụm, còn chia theo depot chỉ có 6 cụm/nhóm nên không đạt; chờ chốt với D1 ở CP4).
